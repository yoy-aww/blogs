      最近有人问我：”做微信小程序商城，能不能赚钱？”

答案完全不同。
一、先拆解”微信小程序商城”到底是什么“做微信小程序商城”这句话太宽了，它至少包含四种完全不同的商业形态：
形态一：自己开店卖货
