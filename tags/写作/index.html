    <h2><a href="/blogs/2026/09/09/blogging-anonymity-public-writing/">我的博客开始不再是我自己了</a></h2>
    <time>2026-09-09 20:09</time>
    <div class="excerpt">
      引言从这一批开始，我的博客不再是我自己了。
不是比喻。是决定。
过去几年，我博客里写过：

我有多钱
我在哪个行业
我最近挣了多少
我打算做什么
我在什么处境里

从这一批开始，我不再写这些。
不是因为我不再有这些经历。
是因为我意识到——这些经历属于我，不属于博客。

一、我以前把博客当日记写博客的第一年，我把它当成公开的日记。
“我想记录什么，就写什么。”
存款多少、日薪多少、处在什么处...
