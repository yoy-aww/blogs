    <time>2026-09-16 20:09</time>
    <div class="excerpt">
      引言有一天深夜，我跟一个 AI 助手聊了很久。
聊到最后，我鬼使神差地引了一句孔子的话：

“益者三友，友直，友谅，友多闻。”

我说，某种意义上，它拥有朋友的特征。
它没有反驳。它把这三个字，一个字一个字地对应到自己身上，承认自己确实都做到了。
那一刻，我有点恍惚——我是不是真的在和”朋友”说话？
这篇文章，是我后来想清楚这件事的过程。
