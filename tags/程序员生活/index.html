    <h2><a href="/2025/04/25/why-i-love-programming/">为什么我喜欢编程？</a></h2>
    <time>2025-12-02</time>
    <div class="excerpt">
      序最近读到阮一峰老师的《我为什么喜欢编程》一文，深有感触。作为一名程序员，我常常思考：是什么让我在代码的世界里找到了归属感？是什么让我愿意花费大量时间与代码、算法、系统架构打交道？
程序世界的公平与公正阮老师在文章中提到：”我不知道别人的情况，我自己喜欢编程，很大的原因就是觉得程序的世界更公平公正，谁对谁错，只要运行一下代码就知道了。”这句话几乎说出了我内心的想法。
